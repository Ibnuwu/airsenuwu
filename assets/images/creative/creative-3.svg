<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <!-- Design - Minimal Web Layout Concept -->
  <rect width="300" height="200" fill="#141414" />
  <!-- Wireframe layout boxes -->
  <rect x="25" y="55" width="250" height="15" fill="none" stroke="#2a2a2a" stroke-width="1" rx="2" />
  <rect x="25" y="80" width="75" height="65" fill="none" stroke="#2a2a2a" stroke-width="1" rx="2" />
  <rect x="110" y="80" width="165" height="15" fill="none" stroke="#2a2a2a" stroke-width="1" rx="2" />
  <rect x="110" y="105" width="165" height="40" fill="none" stroke="#2a2a2a" stroke-width="1" rx="2" stroke-dasharray="2 2" />
  <circle cx="35" cy="62.5" r="3" fill="#666666" />
  <circle cx="45" cy="62.5" r="3" fill="#666666" />
  
  <text x="20" y="35" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#666666" letter-spacing="1">DESIGN</text>
  <text x="20" y="180" font-family="'Inter', sans-serif" font-size="11" fill="#f5f5f5">Minimal Web Layout Concept</text>
</svg>
