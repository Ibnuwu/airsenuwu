<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- Artwork - Neon Cyberpunk Sphere -->
  <rect width="300" height="300" fill="#0d0d0d" />
  <defs>
    <radialGradient id="sphereGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.01" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <circle cx="150" cy="150" r="80" fill="none" stroke="#222222" stroke-width="1"/>
  <!-- Cyber line structures -->
  <path d="M 70 150 A 80 80 0 0 1 230 150" fill="none" stroke="#666666" stroke-width="0.5" stroke-dasharray="3 3" />
  <path d="M 70 150 A 80 30 0 0 0 230 150" fill="none" stroke="#888888" stroke-width="0.75" />
  <path d="M 70 150 A 80 10 0 0 0 230 150" fill="none" stroke="#f5f5f5" stroke-width="1.25" />
  
  <!-- Glowing Center -->
  <circle cx="150" cy="150" r="100" fill="url(#sphereGlow)" />
  <circle cx="150" cy="150" r="2" fill="#ffffff" />
  
  <text x="20" y="35" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#666666" letter-spacing="1">ARTWORK</text>
  <text x="20" y="275" font-family="'Inter', sans-serif" font-size="11" fill="#f5f5f5">Neon Cyberpunk Sphere</text>
</svg>
