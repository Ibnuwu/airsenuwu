backend:
  name: github
  repo: Ibnuwu/airsenuwu
  branch: main
  auth_type: pkce
  app_id: Ov23li7LILadx8NEOppL

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  # --- Projects ---
  - name: "projects"
    label: "Projects"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    media_folder: "assets/images/projects"
    public_folder: "/assets/images/projects"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Slug", name: "slug", widget: "string"}
      - {label: "Featured Flag", name: "featured", widget: "boolean", default: false}
      - {label: "Featured Image / Thumbnail", name: "thumbnail", widget: "image", required: false}
      - {label: "Category", name: "category", widget: "string"}
      - {label: "Short Description", name: "description", widget: "text"}
      - {label: "Full Description / Body", name: "body", widget: "markdown", required: false}
      - {label: "Tech Stack", name: "tech", widget: "string", hint: "Comma separated tags"}
      - {label: "Demo URL", name: "demo", widget: "string", required: false}
      - {label: "GitHub URL", name: "repo", widget: "string", required: false}
      - {label: "Status", name: "status", widget: "select", options: ["Featured", "Completed", "Active", "In Progress"], default: "Completed"}
      - {label: "Date", name: "date", widget: "datetime", required: false}

  # --- Blog ---
  - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    media_folder: "assets/images/blog"
    public_folder: "/assets/images/blog"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Slug", name: "slug", widget: "string"}
      - {label: "Cover Image", name: "cover_image", widget: "image", required: false}
      - {label: "Excerpt", name: "excerpt", widget: "text"}
      - {label: "Content / Body", name: "body", widget: "markdown"}
      - {label: "Category", name: "category", widget: "string"}
      - {label: "Tags", name: "tags", widget: "string", required: false, hint: "Comma separated"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Read Time", name: "read_time", widget: "string", required: false}

  # --- Creative Work ---
  - name: "creative"
    label: "Creative Work"
    folder: "content/creative"
    create: true
    slug: "{{slug}}"
    media_folder: "assets/images/creative"
    public_folder: "/assets/images/creative"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Slug", name: "slug", widget: "string"}
      - {label: "Image", name: "image", widget: "image"}
      - {label: "Description", name: "description", widget: "text", required: false}
      - {label: "Category", name: "category", widget: "select", options: ["digital sketch", "sketchbook scan", "design asset", "photography", "experiment"]}
      - {label: "Date", name: "date", widget: "datetime", required: false}
      - {label: "External Link", name: "external_link", widget: "string", required: false}