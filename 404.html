<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halaman Tidak Ditemukan — 404</title>
  
  <!-- Google Fonts — Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-primary: #0a0a0a;
      --bg-card: #141414;
      --text-primary: #f5f5f5;
      --text-secondary: #a0a0a0;
      --border: #2a2a2a;
      --accent: #e0e0e0;
      --font-family: 'Inter', system-ui, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .error-container {
      text-align: center;
      max-width: 400px;
      padding: 40px 24px;
      border: 1px solid var(--border);
      background-color: var(--bg-card);
      border-radius: 16px;
    }

    .error-code {
      font-size: 4.5rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 8px;
    }

    .error-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .error-desc {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      background-color: var(--text-primary);
      color: var(--bg-primary);
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      border-radius: 8px;
      transition: opacity 0.2s ease;
    }

    .btn-home:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">Halaman Hilang</h1>
    <p class="error-desc">Halaman yang kamu cari mungkin telah dipindahkan, dihapus, atau tidak pernah ada.</p>
    <a href="index.html" class="btn-home">Kembali ke Beranda</a>
  </div>

</body>
</html>
